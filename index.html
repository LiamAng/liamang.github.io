<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liam Ang</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Minecraftia, monospace;
      text-align: center;
    }

    progress::-webkit-progress-bar {
      background: transparent
    }

    progress::-webkit-progress-value {
      background: #fff
    }

    progress::-moz-progress-bar {
      background: #fff
    }

     @keyframes splash-pulse {
      from {
        transform: rotate(-20deg) scale(1)
      }

      to {
        transform: rotate(-20deg) scale(1.15)
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0
      }

      to {
        opacity: 1;
        visibility: visible;
      }
    }

    .hide {
      animation: fadeOut 1s linear forwards
    }

    .show {
      animation: fadeIn 1s linear forwards
    }

    * {
      -webkit-user-select: none;
      -ms-user-select: none; 
      user-select: none; 
      &::-webkit-scrollbar {
        display: none;
      }
      scrollbar-width: none
    }

    .ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: 100;
      margin: 0;
      -webkit-font-smoothing: none;
      font-smooth: never;
      color:white;
      -moz-osx-font-smoothing: grayscale
    }

    #title-container {
      position: relative;
      width: clamp(220px, 90vw, 600px);
      margin-top: 8vh;
      margin-bottom: 20vh
    }

    .mc-button {
      image-rendering: pixelated;
      border-image-source: var(--btn-bg);
      border-image-slice: 3 fill;
      border-width: 6px;
      border-image-repeat: stretch;
      background: transparent;
      color: #fff;
      font-family: Minecraftia, monospace;
      font-size: 18px;
      padding: 0 24px;
      width: 100%;
      height: 50px;
      cursor: pointer;
      text-shadow: 2px 2px #3F3F3F;
      word-break: break-all;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;

      &:hover,
      &:focus-visible {
        border-image-source: var(--btn-bg-hover)
      }
    }

    .menu {
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-bottom {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    @media (max-height: 600px) {
      .menu {
        max-width: 350px;
        gap: 5px;
      }

      .mc-button {
        height: clamp(35px, 5vh, 50px);
        font-size: clamp(13px, 2.2vh, 18px);
        padding: 0 clamp(15px, 2vh, 24px);
        border-width: 4px;
      }

      .menu-bottom {
        margin-top: 10px;
        gap: 5px;
      }

      #title-container {
        width: auto;
        height: 20vh;
        margin-bottom: 10vh;
      }
    }

    .dark-background {
      background: var(--m-bg);
      padding-bottom: 10px;
    }

    #menu-screen .title {
      color: #fff;
      text-shadow: 2px 2px #3F3F3F;
      font-size: 18px;
    }

    .mc-input {
      image-rendering: pixelated;
      border-image-source: var(--tf-bg);
      border-image-slice: 1 fill;
      border-width: 2px;
      border-image-repeat: stretch;
      color: #fff;
      font-family: Minecraftia, monospace;
      font-size: 16px;
      width: 80vw;
      max-width: 480px;
      height: 40px;
      cursor: text;
      text-shadow: 2px 2px #3F3F3F;
      word-break: break-all;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
    }

    .mc-input:hover,
    .mc-input:focus-visible {
      border-image-source: var(--tf-bg-hover)
    }

    .header-separator {
      background: var(--hs);
      background-size: 100% 100%;
      width: 100vw;
      height: 4px;
      image-rendering: pixelated;
      margin-top: 10px;
    }

    .footer-separator {
      background: var(--fs);
      background-size: 100% 100%;
      width: 100vw;
      height: 4px;
      image-rendering: pixelated;
      margin-bottom: 20px
    }

    .menu-container {
      background: var(--ml-bg);
      height: 70vh;
      width: 100vw;
      display: flex;
      overflow-y: hidden;
      justify-content: center;
    }

    .menu-container.column {
      flex-direction: column;
    }

    #menu-list {
      width: 670px;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
    }

    #versions {
      width: 670px;
      max-width: 90%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: scroll;
      align-items: center;
      .mc-button {
        flex-shrink: 0;
      }
    }

    #menu-list .content {
      display: flex;
      align-items: center;
      text-shadow: 2px 2px #3F3F3F;
      padding-right: 100px;
      
      @media (max-width: 550px) { padding-right: 0; }

      .icon {
        display: grid;
        place-items: center;
        width: 80px;
        height: 80px;
        margin: 10px;
        background-color: #fff;
        flex-shrink: 0;

        > * {
          grid-area: 1 / 1;
          min-width: 0;
          min-height: 0;
        }

        img {
          max-width: 100%;
          max-height: 100%;
        }

        button {
          width: 100%;
          height: 100%;
          background-image: var(--join);
          background-color: transparent;
          background-size: cover;
          image-rendering: pixelated;
          border: none;
          opacity: 0;
          pointer-events: none;

          &:hover {
            background-image: var(--join-hover);
          }
        }
      }
 
      .info {
        min-width: 0;
        flex: 1;

        p {
          margin: 0;
          align-items: start;
          text-align: start;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .description {
          color: #AAAAAA;
        }
      }

      &:hover {
        .icon button {
          opacity: 1;
          pointer-events: auto;
        }
      }

      &.selected {
        border-image-source: var(--tf-bg-hover);
        border-image-slice: 1 fill;
        border-image-width: 2px;
        border-image-repeat: stretch;
      }
    }

    #menu-options {
      max-width: 90vw;
      & > * + * {
        margin-top: 5px;
      }
      button {
        width: 190px;
        margin-inline: 5px;
      }
      margin-bottom: 5px;
    }

    .back-button {
      width: 500px;
      max-width: 80vw;
      flex-shrink: 0;
    }

    footer p {
      margin: 5px;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      footer p {
        font-size: 3vw;
      }
    }

    .about-icon {
      image-rendering: pixelated;
      width: 167px;
      aspect-ratio: 1;
      flex-shrink: 0;
      content: var(--abt-icon);
    }

    .main-infos {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: start;
      gap: 40px;
      max-width: 600px;
      margin: 0 auto;
      padding-inline: 16px;
      @media (max-width: 500px) {
        flex-direction: column;
        p {
          margin-inline: 10px;
        }
      }
    }
    .socials{
      display:flow-root;
      padding-top: 50px;
      button {
        max-width: 90%;
        width: 400px;
      }
      margin-bottom: 20px;
      & > * + * {
        margin-top: 10px;
      }
    }

    .scroll-container {
      width: 100%;
      overflow: scroll;
    }

    #panorama {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #title {
      width: 100%;
      height: 100%;
      display: block;
      -webkit-user-drag: none;
    }

    #splash-text {
      position: absolute;
      right: 6.7%;
      bottom: -5%;
      font-size: min(clamp(2px, 4cqh, 24px), clamp(2px, 4vw, 24px));
      transform-origin: center;
      animation: splash-pulse .4s infinite alternate ease-in-out;
      white-space: nowrap;
      z-index: 10;
      color: #FFFF55;
      text-shadow: 3px 3px #3F3F15;
    }

    footer {
      display: flex;
      position: absolute;
      bottom: 0;
      width: 100%;
      color: #fff;
      text-shadow: 2px 2px #3F3F3F;
      justify-content: space-between;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ef313d;
      color: #fff;
      z-index: 99999;
    }

    #progress {
      width: 50%;
      height: 25px;
      border: solid 3px white;
      border-radius: 0;
      padding: 2px;
      background: transparent;
    }

    #click-prompt {
      position: absolute;
      bottom: 0;
      visibility: hidden;
    }

    #stupid {
      width: 0px;
      height: 0px;
    }
  </style>
</head>

<body>
  <canvas id="panorama"></canvas>

  <div id="main-menu" class="ui">
    <div id="title-container">
      <img id="title" alt="Minecraft" draggable="false">
      <p id="splash-text"></p>
    </div>

    <div class="menu">
      <button class="mc-button" id="flowchart-button">Flowchart</button>
      <button class="mc-button" id="projects-button">Projects</button>
      <button class="mc-button" id="about-button">About Me</button>

      <div class="menu-bottom">
        <button class="mc-button" id="options-button">Options...</button>
        <button class="mc-button" onclick="location.href='https://sites.google.com/view/ditizens/individual-projects'">
          Quit Game
        </button>
      </div>
    </div>

    <footer>
      <p>© 2026-2027 DIT 1-1</p>
      <p>PUP Iskolar ng Bayan</p>
    </footer>
  </div>

  <div id="menu-screen" class="ui dark-background" style="display: none;">
    <p class="title" id="menu-title"></p>
    <input class="mc-input" id="menu-search">
    <div class="header-separator"></div>
    <div id="menu-container" class="menu-container">
      <div id="menu-list"></div>
    </div>
    <div class="footer-separator"></div>
    <div id="menu-options"></div>
    <button id="back" class="mc-button back-button"
      onclick="document.getElementById('menu-screen').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'">
      Back
    </button>
  </div>

  <div id="options-screen" class="ui dark-background" style="display: none;">
    <p class="title" id="options-title">Select Version</p>
    <div class="header-separator"></div>
    <div class="menu-container">
      <div id="versions"></div>
    </div>
    <div class="footer-separator"></div>
    <button class="mc-button back-button"
      onclick="document.getElementById('options-screen').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'">
      Back
    </button>
  </div>

  <div id="about-screen" class="ui dark-background" style="display: none">
    <p class="title">About Me</p>
    <div class="header-separator"></div>
    <div class="menu-container column">
      <div class="scroll-container">
        <div class="main-infos">
          <img class="about-icon">
          <div class="about-me">
            <p>Name: Liam Richardson C. Ang</p>
            <p id="age"></p>
            <p>Birthday: February 1 2008 7:39 am</p>
            <p>Hobbies/Interests: Doom scrolling, Coding, Native Modding, Technical Minecraft</p>
          </div>
        </div>
        <div class="socials">
          <button class="mc-button" onclick="window.open('https://github.com/Zeuroux')">Github (main)</button>
          <button class="mc-button" onclick="window.open('https://github.com/LiamAng')">Github (school)</button>
          <button class="mc-button" onclick="window.open('https://www.facebook.com/liamrichardson.ang')">Facebook</button>
          <button class="mc-button" onclick="window.open('https://www.instagram.com/zeuroux/')">Instagram</button>
          <button class="mc-button" onclick="window.open('https://discord.com/users/779174051092234261')">Discord</button>
        </div>
      </div>
    </div>
    <div class="footer-separator"></div>
    <button class="mc-button back-button"
      onclick="document.getElementById('about-screen').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'">
      Back
    </button>
  </div>

  <script type="module" src="index.js"></script>

</body>

</html>
