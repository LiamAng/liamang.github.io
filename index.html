<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liam Ang</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Minecraftia, monospace;
      text-align: center;
    }

    * {
      -webkit-user-select: none;
      -ms-user-select: none; 
      user-select: none; 
    }

    .ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: 100;
      margin: 0;
      -webkit-font-smoothing: none;
      font-smooth: never;
      color:white;
      -moz-osx-font-smoothing: grayscale
    }

    #title-container {
      position: relative;
      width: clamp(220px, 90vw, 600px);
      margin-top: 8vh;
      margin-bottom: 20vh
    }

    .mc-button {
      image-rendering: pixelated;
      border-image-source: var(--btn-bg);
      border-image-slice: 3 fill;
      border-width: 6px;
      border-image-repeat: stretch;
      background: transparent;
      color: #fff;
      font-family: Minecraftia, monospace;
      font-size: 18px;
      padding: 0 24px;
      width: 100%;
      height: 50px;
      cursor: pointer;
      text-shadow: 2px 2px #3F3F3F;
      word-break: break-all;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    .mc-button:hover {
      border-image-source: var(--btn-bg-hover)
    }

    .menu {
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-bottom {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    @media (max-height: 600px) {
      .menu {
        max-width: 350px;
        gap: 5px;
      }

      .mc-button {
        height: clamp(35px, 5vh, 50px);
        font-size: clamp(13px, 2.2vh, 18px);
        padding: 0 clamp(15px, 2vh, 24px);
        border-width: 4px;
      }

      .menu-bottom {
        margin-top: 10px;
        gap: 5px;
      }

      #title-container {
        width: auto;
        height: 20vh;
        margin-bottom: 10vh;
      }
    }

    .dark-background {
      background: var(--m-bg);
      padding-bottom: 10px;
    }

    #menu-screen .title {
      color: #fff;
      text-shadow: 2px 2px #3F3F3F;
      font-size: 18px;
    }

    .mc-input {
      image-rendering: pixelated;
      border-image-source: var(--tf-bg);
      border-image-slice: 1 fill;
      border-width: 2px;
      border-image-repeat: stretch;
      color: #fff;
      font-family: Minecraftia, monospace;
      font-size: 16px;
      width: 80vw;
      max-width: 600px;
      height: 40px;
      cursor: text;
      text-shadow: 2px 2px #3F3F3F;
      word-break: break-all;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
    }

    .mc-input:hover {
      border-image-source: var(--tf-bg-hover)
    }

    .header-separator {
      background: var(--hs);
      background-size: 100% 100%;
      width: 100vw;
      height: 4px;
      image-rendering: pixelated;
      margin-top: 10px;
    }

    .footer-separator {
      background: var(--fs);
      background-size: 100% 100%;
      width: 100vw;
      height: 4px;
      image-rendering: pixelated;
      margin-bottom: 20px
    }

    #menu-container {
      background: var(--ml-bg);
      height: 70vh;
      width: 100vw;
      display: flex;
      overflow-y: hidden;
      justify-content: center;
    }

    #menu-list {
      width: 670px;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
      &::-webkit-scrollbar {
        display: none; /* Hide scrollbar */
      }
      scrollbar-width: none
    }
    /* ::-webkit-scrollbar {
      width: 20px;
      background-image: url("https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/refs/heads/26.1/assets/minecraft/textures/gui/sprites/widget/scroller_background.png");
      background-size: 100% 100%;
      image-rendering: pixelated;
    }

    ::-webkit-scrollbar-thumb {
      background-image: url("https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/refs/heads/26.1/assets/minecraft/textures/gui/sprites/widget/scroller.png");
      background-size: 100% 100%;
      background-repeat: repeat-y;
      image-rendering: pixelated;
    } */

    #menu-list .content {
      display: flex;
      align-items: center;
      text-shadow: 2px 2px #3F3F3F;
      white-space: nowrap;
      .icon {
        position: relative;
        display: block;
        width: 80px;
        height: 80px;
        aspect-ratio: 1;
        padding: 10px;

        .whiteout {
          width: 100%;
          height: 100%;
          background-color: white;
        }

        img {
          position: absolute;
          inset: 10px;
          max-width: calc(100% - 20px);
          max-height: calc(100% - 20px);
          margin: auto;
          z-index: 1;
        }

        button {
          position: absolute;
          inset: 10px;
          width: calc(100% - 20px);
          height: calc(100% - 20px);

          background-image: var(--join);
          background-color: transparent;
          background-size: cover;
          image-rendering: pixelated;
          border: none;
          z-index: 2;

          opacity: 0;
          pointer-events: none;

          &:hover {
            background-image: var(--join-hover)
          }
        }
      }

      &:hover {
        .icon button {
          opacity: 1;
          pointer-events: auto;
        }
      }

      .info {
        p {
          margin: 0;
          align-items: start;
          text-align: start;
        }

        .description {
          color: #AAAAAA;
        }
      }

      &.selected {
        border-image-source: var(--tf-bg-hover);
        border-image-slice: 1 fill;
        border-image-width: 2px;
        border-image-repeat: stretch;
        image-rendering: pixelated;
      }
    }

    #back {
      width: 80vw;
    }

    footer p {
      margin: 5px;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      footer p {
        font-size: 3vw;
      }
    }

    progress::-webkit-progress-bar {
      background: transparent
    }

    progress::-webkit-progress-value {
      background: #fff
    }

    progress::-moz-progress-bar {
      background: #fff
    }

    @keyframes splash-pulse {
      from {
        transform: rotate(-20deg) scale(1)
      }

      to {
        transform: rotate(-20deg) scale(1.15)
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0
      }

      to {
        opacity: 1;
        visibility: visible
      }
    }

    .hide {
      animation: fadeOut 1s linear forwards
    }

    .show {
      animation: fadeIn 1s linear forwards
    }
  </style>
</head>

<body>

  <canvas id="panorama" style="position:fixed;inset:0;width:100%;height:100%;display:block"></canvas>

  <div id="main-menu" class="ui">
    <div id="title-container">
      <img id="title" alt="Minecraft" draggable="false"
        style="width:100%;height:100%;display:block;-webkit-user-drag:none">
      <p id="splash-text" style="position:absolute;right:6.7%;bottom:-5%;
        font-size: min(clamp(2px,4cqh,24px), clamp(2px,4vw,24px));
        transform-origin:center;
        animation:splash-pulse .4s infinite alternate ease-in-out;
        white-space:nowrap;
        z-index:10;
        color:#FFFF55;
        text-shadow:3px 3px #3F3F15">
      </p>
    </div>

    <div class="menu">
      <button class="mc-button" id="flowchart-button">Flowchart</button>
      <button class="mc-button" id="projects-button">Projects</button>
      <button class="mc-button">About Me</button>

      <div class="menu-bottom">
        <button class="mc-button" id="options-button">Options...</button>
        <button class="mc-button" onclick="location.href='https://sites.google.com/view/ditizens/individual-projects'">
          Quit Game
        </button>
      </div>
    </div>

    <footer
      style="display:flex;position:absolute;bottom:0;width:100%;color:#fff;text-shadow:2px 2px #3F3F3F;justify-content:space-between">
      <p>© 2026-2027 DIT 1-1</p>
      <p>PUP Iskolar ng Bayan</p>
    </footer>
  </div>

  <div id="menu-screen" class="ui dark-background" style="display: none;">
    <p class="title" id="menu-title"></p>
    <input class="mc-input" id="menu-search">
    <div class="header-separator"></div>
    <div id="menu-container">
      <div id="menu-list"></div>
    </div>
    <div class="footer-separator"></div>
    <button id="back" class="mc-button"
      onclick="document.getElementById('menu-screen').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'">
      Back
    </button>
  </div>

  <div id="options-screen" class="ui dark-background" style="display: none;">
    <p class="title" id="options-title">Select Version</p>
    <div class="header-separator"></div>
    <div id="menu-container">
      <div id="versions" style="display: flex; flex-direction: column;gap: 10px"> 

      </div>
    </div>
    <div class="footer-separator"></div>
    <button id="back" class="mc-button"
      onclick="document.getElementById('options-screen').style.display = 'none'; document.getElementById('main-menu').style.display = 'flex'">
      Back
    </button>
  </div>

  <div id="splash"
    style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#ef313d;color:#fff;z-index:99999">

      <g>
        <path transform="translate(304.88 194.77)"

    <progress id="progress" max="100" value="0"
      style="width:50%;height:25px;border:solid 3px white;border-radius:0;padding:2px;background:transparent"></progress>
    <p id="click-prompt" style="position:absolute;bottom:0;visibility:hidden">Click anywhere to start</p>
  </div>

  <script type="module" src="index.js"></script>

</body>

</html>
